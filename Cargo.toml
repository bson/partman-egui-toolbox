[workspace]
members = ["partman-card", "partman-sidebar", "partman-workflow"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://git.rockgarden.net/bson/partman-egui-toolbox"

[workspace.dependencies]
egui = "0.36"
egui_kittest = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
