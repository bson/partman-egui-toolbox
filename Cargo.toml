[workspace]
members = ["partman-3d", "partman-card", "partman-fonts", "partman-proof", "partman-scroll", "partman-sidebar", "partman-table", "partman-widgets", "partman-workflow"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bson/partman-egui-toolbox"

[workspace.dependencies]
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["serde"] }
egui_kittest = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
