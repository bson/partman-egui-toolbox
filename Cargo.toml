[package]
name = "egui-cards"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A board of cards for egui: tabbed cards in stacks the user moves, resizes and rearranges"
license = "AGPL-3.0-or-later"

[dependencies]
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = "0.36"
